services:
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: product-db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: productdb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    depends_on:
      product-db:
        condition: service_healthy

  product-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: cart-db
      DB_PORT: "5432"
      DB_DATABASE: cartdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      PRODUCT_SERVICE_URL: http://product-service:3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
      LOG_CHANNEL: stderr
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:3001/health') === false ? 1 : 0);"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
    depends_on:
      cart-db:
        condition: service_healthy
      product-service:
        condition: service_healthy

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  order-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_USER: orderuser
      MYSQL_PASSWORD: orderpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: order-db
      DB_PORT: "3306"
      DB_DATABASE: orderdb
      DB_USERNAME: orderuser
      DB_PASSWORD: orderpassword
      PRODUCT_SERVICE_URL: http://product-service:3000
      CART_SERVICE_URL: http://cart-service:3001
      HTTP_TIMEOUT: "5"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
      LOG_CHANNEL: stderr
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:3003/api/health') === false ? 1 : 0);"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      FLASK_DEBUG: "1"
      MONGO_URI: mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      MONGO_DB_NAME: reviewdb
      PRODUCT_SERVICE_URL: http://product-service:3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=3)"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_healthy

  ecommerce-ui:
    build:
      context: ./ecommerce-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_PRODUCT_URL: http://localhost:8080
      VITE_CART_URL: http://localhost:8080
      VITE_REVIEW_URL: http://localhost:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 5
      start_period: 15s
      timeout: 5s
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PRODUCT_URL: http://product-service:3000
      CART_URL: http://cart-service:3001
      REVIEW_URL: http://review-service:3002
      ORDER_URL: http://order-service:3003
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/catalog').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    depends_on:
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      review-service:
        condition: service_healthy

  review-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: appuser
      MONGO_INITDB_ROOT_PASSWORD: apppassword
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

volumes:
  product-db-data:
  cart-db-data:
  order-db-data:
  review-db-data: